name: Nightly

on:
  schedule:
    # 02:23 Asia/Shanghai. A non-zero minute reduces peak scheduler delay.
    - cron: "23 18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: macos-15
            platform: darwin-aarch64
          - os: windows-2025
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out the nightly commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MoonBit
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Install MoonBit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Set-ExecutionPolicy RemoteSigned -Scope CurrentUser
          Invoke-RestMethod https://cli.moonbitlang.com/install/powershell.ps1 | Invoke-Expression
          Join-Path $env:USERPROFILE '.moon\bin' | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0

      - name: Record the toolchain
        run: moon version --all

      - name: Update the Mooncakes registry
        run: moon update

      - name: Resolve dependencies and check native packages
        run: moon check --target native --deny-warn

      - name: Run release tests
        run: moon test --target native --release --frozen

      - name: Build stripped release binary
        run: moon build --target native --release --strip --frozen cmd/pumd

      - name: Locate the Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary_base="_build/native/release/build/rainbowdashy/pumd/cmd/pumd/pumd"
          for candidate in "$binary_base" "$binary_base.exe"; do
            if [[ -f "$candidate" ]]; then
              echo "PUMD_BINARY=$candidate" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          printf 'native pumd binary was not found under %s\n' "$(dirname "$binary_base")" >&2
          find "$(dirname "$binary_base")" -maxdepth 1 -type f -print >&2
          exit 1

      - name: Locate the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binaryBase = '_build/native/release/build/rainbowdashy/pumd/cmd/pumd/pumd'
          $binary = @($binaryBase, "$binaryBase.exe") | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } | Select-Object -First 1
          if (-not $binary) {
            throw "native pumd binary was not found under $(Split-Path $binaryBase)"
          }
          "PUMD_BINARY=$binary" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Smoke test the Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set +e
          output="$("$PUMD_BINARY" 2>&1)"
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            printf 'expected pumd without arguments to exit 1, got %s\n%s\n' "$status" "$output" >&2
            exit 1
          fi
          if [[ "$output" != *"usage: pumd publish <markdown-path>"* ]]; then
            printf 'pumd did not print its usage message:\n%s\n' "$output" >&2
            exit 1
          fi

      - name: Smoke test the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $output = & $env:PUMD_BINARY 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1) {
            throw "expected pumd without arguments to exit 1, got $LASTEXITCODE"
          }
          if ($output -notmatch 'usage: pumd publish <markdown-path>') {
            throw "pumd did not print its usage message: $output"
          }
          exit 0

      - name: Package the Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="pumd-nightly-${{ matrix.platform }}"
          mkdir -p "dist/$archive"
          install -m 0755 "$PUMD_BINARY" "dist/$archive/pumd"
          cp README.md "dist/$archive/README.md"
          tar -C dist -czf "dist/$archive.tar.gz" "$archive"
          rm -r "dist/$archive"

      - name: Package the Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = 'pumd-nightly-${{ matrix.platform }}'
          $archiveDirectory = Join-Path 'dist' $archive
          New-Item -ItemType Directory -Path $archiveDirectory -Force | Out-Null
          Copy-Item $env:PUMD_BINARY (Join-Path $archiveDirectory 'pumd.exe')
          Copy-Item 'README.md' (Join-Path $archiveDirectory 'README.md')
          Compress-Archive -Path $archiveDirectory -DestinationPath "dist\$archive.zip"
          Remove-Item -LiteralPath $archiveDirectory -Recurse

      - name: Upload the packaged binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pumd-nightly-${{ matrix.platform }}
          path: dist/pumd-nightly-*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish rolling nightly release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pumd-nightly-*
          path: dist
          merge-multiple: true

      - name: Create checksums
        shell: bash
        run: |
          cd dist
          sha256sum pumd-nightly-* > SHA256SUMS

      - name: Point the nightly tag at this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" --raw-field sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" --raw-field ref='refs/tags/nightly' --raw-field sha="$GITHUB_SHA" > /dev/null
          fi

      - name: Publish the rolling prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built_at="$(date -u '+%Y-%m-%d %H:%M UTC')"
          notes="$(printf 'Automated nightly build from main.\n\nCommit: %s\nBuilt: %s\n\nThis prerelease is replaced in place and may be unstable.' "$GITHUB_SHA" "$built_at")"
          if gh release view nightly --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload nightly dist/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit nightly --repo "$GITHUB_REPOSITORY" --title 'pumd nightly' --notes "$notes" --prerelease
          else
            gh release create nightly dist/* --repo "$GITHUB_REPOSITORY" --verify-tag --title 'pumd nightly' --notes "$notes" --prerelease
          fi

  publish-npm:
    name: Publish npm nightly
    needs: build
    if: github.ref == 'refs/heads/main' && vars.NPM_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the nightly commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download packaged binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pumd-nightly-*
          path: dist
          merge-multiple: true

      - name: Assemble npm package binaries
        shell: bash
        run: |
          mkdir -p npm-binaries/darwin-arm64 npm-binaries/linux-x64 npm-binaries/win32-x64
          tar -C npm-binaries/darwin-arm64 --strip-components=1 -xzf dist/pumd-nightly-darwin-aarch64.tar.gz
          tar -C npm-binaries/linux-x64 --strip-components=1 -xzf dist/pumd-nightly-linux-x86_64.tar.gz
          unzip -j dist/pumd-nightly-windows-x86_64.zip '*/pumd.exe' -d npm-binaries/win32-x64
          rm npm-binaries/darwin-arm64/README.md npm-binaries/linux-x64/README.md
          chmod 0755 bin/pumd.cjs npm-binaries/darwin-arm64/pumd npm-binaries/linux-x64/pumd npm-binaries/win32-x64/pumd.exe
          test -x npm-binaries/darwin-arm64/pumd
          test -x npm-binaries/linux-x64/pumd
          test -x npm-binaries/win32-x64/pumd.exe

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Use an npm CLI with trusted publishing support
        run: npm install --global npm@11.19.0

      - name: Test the npm launcher
        run: npm test

      - name: Require a public distribution license
        shell: bash
        run: |
          license="$(node -p "require('./package.json').license || ''")"
          if [[ -z "$license" || "$license" == 'UNLICENSED' ]]; then
            printf 'package.json must declare the chosen public SPDX license before npm publishing is enabled\n' >&2
            exit 1
          fi
          if ! compgen -G 'LICENSE*' > /dev/null && ! compgen -G 'COPYING*' > /dev/null; then
            printf 'a root LICENSE or COPYING file is required before npm publishing is enabled\n' >&2
            exit 1
          fi

      - name: Pack the commit version
        shell: bash
        run: |
          base_version="$(node -p "require('./package.json').version")"
          version="$(node scripts/npm-nightly-version.cjs "$base_version" "$GITHUB_SHA")"
          npm pkg set version="$version"
          package_name="$(npm pack --pack-destination dist --json | node -e 'let input = ""; process.stdin.on("data", chunk => input += chunk).on("end", () => console.log(JSON.parse(input)[0].filename))')"
          package_file="./dist/$package_name"
          test -f "$package_file"
          echo "PUMD_NPM_VERSION=$version" >> "$GITHUB_ENV"
          echo "PUMD_NPM_PACKAGE=$package_file" >> "$GITHUB_ENV"

      - name: Smoke test the packed npm command
        shell: bash
        run: |
          install_root="$(mktemp -d)"
          trap 'rm -r "$install_root"' EXIT
          npm install --global --prefix "$install_root" "$PUMD_NPM_PACKAGE"
          set +e
          output="$("$install_root/bin/pumd" 2>&1)"
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            printf 'expected packed pumd without arguments to exit 1, got %s\n%s\n' "$status" "$output" >&2
            exit 1
          fi
          if [[ "$output" != *"usage: pumd publish <markdown-path>"* ]]; then
            printf 'packed pumd did not print its usage message:\n%s\n' "$output" >&2
            exit 1
          fi

      - name: Publish the npm nightly
        shell: bash
        run: |
          if npm view "@p0nyyy/pumd@$PUMD_NPM_VERSION" version > /dev/null 2>&1; then
            printf '@p0nyyy/pumd@%s is already published; skipping immutable version\n' "$PUMD_NPM_VERSION"
          else
            npm publish "$PUMD_NPM_PACKAGE" --tag nightly --access public
          fi
